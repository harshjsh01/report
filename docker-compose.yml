version: '3.8'

services:
  gitpulse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gitpulse-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      # - GITHUB_TOKEN=your_token_here
    volumes:
      - ./server/data:/app/server/data
    restart: unless-stopped
